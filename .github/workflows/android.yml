name: Android APK

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore:
      - "rustore/**"
      - "app/tools/rustore_publish.py"
      - ".github/workflows/rustore.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # Релизный ключ хранится в секретах репозитория (Settings → Secrets and variables → Actions):
      # RELEASE_KEYSTORE_BASE64 — файл ключа в base64, RELEASE_KEYSTORE_PASSWORD — пароль.
      # Без них APK подписывается debug-ключом из репозитория и для RuStore не годится.
      - name: Release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет RELEASE_KEYSTORE_BASE64 не задан: APK подписан debug-ключом и не подходит для RuStore."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests and APK
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          RELEASE_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then
            ./gradlew testDebugUnitTest assembleRelease --stacktrace
          else
            ./gradlew testDebugUnitTest assembleDebug --stacktrace
          fi

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME ($VERSION_CODE), commit ${GITHUB_SHA::7}"

      - name: Prepare APK
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          mkdir -p dist
          # Без подписи Gradle назвал бы файл app-release-unsigned.apk — тогда копирование упадёт.
          cp "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" dist/MalenkiyKaravan.apk
          (cd dist && sha256sum MalenkiyKaravan.apk > SHA256SUMS.txt)
          ls -lh dist
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/MalenkiyKaravan.apk | tee signature.txt
          {
            echo "### Подпись APK ($VARIANT)"
            echo '```'
            grep -E "certificate (DN|SHA-256)" signature.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MalenkiyKaravan-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}
          path: dist/MalenkiyKaravan.apk
          if-no-files-found: error

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SHA: ${{ steps.version.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          ## Маленький караван ${VERSION}

          Прогулка по Троицку для детей 4–7 лет с родителями: верблюжонок Троша потерял вещи, помоги их найти.
          Сборка \`${VERSION}\` (versionCode ${CODE}) из ветки \`${BRANCH}\`, коммит [\`${SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          ### Как установить на телефон

          1. Скачайте **MalenkiyKaravan.apk** (версия ${VERSION}) из списка файлов ниже (Assets).
          2. Откройте файл на телефоне и разрешите установку из этого источника, если Android попросит.
          3. Перед прогулкой разрешите доступ к геолокации — так Троша узнает, что вы дошли до точки.

          Требуется Android 8.0 или новее. Новые версии ставятся поверх старых, альбом сохраняется.
          Контрольные суммы — в файле \`SHA256SUMS.txt\`.
          NOTES

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="v${VERSION}"
          # Та же версия, собранная из более нового коммита: тег переезжает на новый коммит.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/MalenkiyKaravan.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Маленький караван ${VERSION}" \
            --notes-file notes.md \
            --latest

      - name: Publish preview pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview \
            dist/MalenkiyKaravan.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Предварительная сборка ${VERSION} (${GITHUB_REF_NAME})" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
