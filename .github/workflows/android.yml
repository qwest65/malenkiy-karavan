name: Android APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME ($VERSION_CODE), commit ${GITHUB_SHA::7}"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MalenkiyKaravan.apk
          (cd dist && sha256sum MalenkiyKaravan.apk > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: MalenkiyKaravan-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}
          path: dist/MalenkiyKaravan.apk
          if-no-files-found: error

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SHA: ${{ steps.version.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          ## Маленький караван ${VERSION}

          Прогулка по Троицку для детей 4–7 лет с родителями: верблюжонок Троша потерял вещи, помоги их найти.
          Сборка \`${VERSION}\` (versionCode ${CODE}) из ветки \`${BRANCH}\`, коммит [\`${SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          ### Как установить на телефон

          1. Скачайте **MalenkiyKaravan.apk** (версия ${VERSION}) из списка файлов ниже (Assets).
          2. Откройте файл на телефоне и разрешите установку из этого источника, если Android попросит.
          3. Перед прогулкой разрешите доступ к геолокации — так Троша узнает, что вы дошли до точки.

          Требуется Android 8.0 или новее. Новые версии ставятся поверх старых, альбом сохраняется.
          Контрольные суммы — в файле \`SHA256SUMS.txt\`.
          NOTES

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="v${VERSION}"
          # Та же версия, собранная из более нового коммита: тег переезжает на новый коммит.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/MalenkiyKaravan.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Маленький караван ${VERSION}" \
            --notes-file notes.md \
            --latest

      - name: Publish preview pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview \
            dist/MalenkiyKaravan.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Предварительная сборка ${VERSION} (${GITHUB_REF_NAME})" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
