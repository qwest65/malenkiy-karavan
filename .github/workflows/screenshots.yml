name: Screenshots

# Снимки всех экранов приложения в эмуляторе Android: главная, выбор маршрута, свой маршрут,
# прогулка по карте, точка, финал и альбом (app/src/androidTest/.../ScreenTour.kt).
# Снимки — в артефакте «screens» этого запуска. Запускается вручную и когда меняются экраны.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "app/src/main/java/ru/cultureguide/kids/ui/**"
      - "app/src/androidTest/**"
      - ".github/workflows/screenshots.yml"

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Walk through the screens in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb emu geo fix 61.5555 54.0840
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace || echo "TOUR_FAILED=1" >> "$GITHUB_ENV"
            mkdir -p screens
            adb pull /sdcard/Android/data/ru.malenkiykaravan/files/screens/. screens/ || true
            ls -la screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            screens/
            app/build/reports/androidTests/
          if-no-files-found: warn

      - name: Fail if the tour failed
        if: env.TOUR_FAILED == '1'
        run: exit 1
